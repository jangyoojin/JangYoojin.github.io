<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="장유진의 안드로이드 개발 포트폴리오">
    <title>장유진 | Android Developer</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#top">YOOJIN</a>
      <nav aria-label="주요 메뉴">
        <a href="#about">About</a>
        <a href="#games">Games</a>
      </nav>
    </header>

    <main id="top" class="page-shell">
      <aside id="about" class="profile-card" aria-labelledby="profile-title">
        <p class="eyebrow">PROFILE</p>
        <h1 id="profile-title">장유진</h1>
        <p class="role">안드로이드 개발 2년차</p>
        <dl class="profile-history">
          <div>
            <dt>학력</dt>
            <dd>포항공과대학교 컴퓨터공학 학사</dd>
          </div>
          <div>
            <dt>경력</dt>
            <dd>삼성전자 재직 3년차</dd>
          </div>
        </dl>
      </aside>

      <section class="content-column" aria-labelledby="welcome-title">
        <p class="eyebrow">HELLO, I'M YOOJIN</p>
        <h2 id="welcome-title">Ideas into useful mobile experiences.</h2>
        <p class="intro">안드로이드와 재미있는 인터랙션을 만들고 있습니다.</p>

        <section id="games" class="games-card" aria-labelledby="games-title">
          <div>
            <p class="eyebrow">PLAYGROUND</p>
            <h2 id="games-title">Games</h2>
            <p>우주선 게임을 준비하고 있습니다. 다음 루프에서 키보드와 터치 조작을 연결합니다.</p>
          </div>
          <span class="game-status" aria-label="게임 준비 상태">COMING SOON</span>
        </section>
      </section>
    </main>
  </body>
</html>
